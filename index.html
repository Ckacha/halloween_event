<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost Hunt</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<style>
  body { background:#111; color:#eee; font-family:sans-serif; text-align:center; margin:0; padding:20px; }
  h1 { margin:0 0 10px; }
  canvas { display:block; margin:0 auto; border-radius:8px; }
</style>
</head>
<body>
  <h1>Ghost Hunt</h1>
  <p>Click the ghosts before time runs out.</p>
  <script>
    let ghost;
    let score = 0;
    let duration = 30;
    let startTime;
    let state = 'start'; // start | play | over
    let spawnEvery = 60;

    function setup() {
      createCanvas(480, 360);
      spawnGhost();
    }

    function spawnGhost() {
      ghost = { x: random(40, width - 40), y: random(40, height - 40) };
    }

    function drawGhost(x, y) {
      noStroke();
      fill(220, 255, 230);
      ellipse(x, y, 60, 60);
      fill(20);
      ellipse(x - 12, y - 5, 10);
      ellipse(x + 12, y - 5, 10);
    }

    function draw() {
      background(15, 10, 25);

      if (state === 'start') {
        textAlign(CENTER, CENTER);
        fill(255);
        textSize(24);
        text('Click to start', width / 2, height / 2);
        return;
      }

      if (state === 'over') {
        textAlign(CENTER, CENTER);
        fill(255);
        textSize(24);
        text('Game over\nScore: ' + score + '\nClick to retry', width / 2, height / 2);
        return;
      }

      let elapsed = (millis() - startTime) / 1000;
      let timeLeft = max(0, duration - elapsed);
      if (timeLeft <= 0) { state = 'over'; return; }

      if (frameCount % spawnEvery === 0) spawnGhost();
      drawGhost(ghost.x, ghost.y);

      textAlign(LEFT, TOP);
      fill(255);
      textSize(18);
      text('Score: ' + score, 12, 10);
      textAlign(RIGHT, TOP);
      text('Time: ' + ceil(timeLeft), width - 12, 10);
    }

    function mousePressed() {
      if (state === 'start' || state === 'over') {
        state = 'play';
        score = 0;
        startTime = millis();
        spawnGhost();
        return;
      }
      if (dist(mouseX, mouseY, ghost.x, ghost.y) < 30) {
        score++;
        spawnGhost();
      }
    }
  </script>
</body>
</html>
